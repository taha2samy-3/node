name: Attest Image
description: Attests build provenance for the multi-platform image and a CycloneDX SBOM for each architecture

inputs:
  image-name:
    description: Full image reference name without tag
    required: true
  image-tag:
    description: Target tag of the image
    required: true
  artifact-suffix:
    description: Suffix used to name the SBOM files (the amd64 SBOM is <suffix>.cyclonedx.json)
    required: true
  registry-username:
    description: Username for GitHub Container Registry
    required: true
  registry-token:
    description: Token for GitHub Container Registry
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - name: Resolve Image and Platform Digests
      id: digests
      shell: bash
      run: |
        manifest=$(docker buildx imagetools inspect "${{ inputs.image-name }}:${{ inputs.image-tag }}" --format '{{json .Manifest}}')
        echo "index=$(echo "$manifest" | jq -r '.digest')" >> "$GITHUB_OUTPUT"
        for arch in amd64 arm64; do
          digest=$(echo "$manifest" | jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' | head -n1)
          if [ -z "$digest" ]; then echo "::error::no linux/$arch image in ${{ inputs.image-name }}:${{ inputs.image-tag }}"; exit 1; fi
          echo "$arch=$digest" >> "$GITHUB_OUTPUT"
        done

    - name: Generate SBOM (amd64)
      uses: anchore/sbom-action@v0
      with:
        image: ${{ inputs.image-name }}@${{ steps.digests.outputs.amd64 }}
        format: cyclonedx-json
        output-file: ${{ inputs.artifact-suffix }}.cyclonedx.json
        upload-artifact: false

    - name: Generate SBOM (arm64)
      uses: anchore/sbom-action@v0
      with:
        image: ${{ inputs.image-name }}@${{ steps.digests.outputs.arm64 }}
        format: cyclonedx-json
        output-file: ${{ inputs.artifact-suffix }}-arm64.cyclonedx.json
        upload-artifact: false

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ steps.digests.outputs.index }}
        push-to-registry: true
        show-summary: false

    - name: Attest SBOM (amd64)
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ steps.digests.outputs.amd64 }}
        predicate-path: ${{ inputs.artifact-suffix }}.cyclonedx.json
        predicate-type: https://cyclonedx.org/bom
        push-to-registry: true
        show-summary: false

    - name: Attest SBOM (arm64)
      uses: actions/attest@v4
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ steps.digests.outputs.arm64 }}
        predicate-path: ${{ inputs.artifact-suffix }}-arm64.cyclonedx.json
        predicate-type: https://cyclonedx.org/bom
        push-to-registry: true
        show-summary: false
