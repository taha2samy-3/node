name: Generate Security Dashboard and Deploy

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_run:
    workflows: ["Build and Push Images"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  

jobs:
  cleanup-previous-runs:
    name: Purge Stale Artifacts (New Run Inbound)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete Stale Report Artifacts from Previous Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Purging leftover report artifacts from previous workflow runs..."
          OLD_IDS=$(gh api --paginate /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | startswith("reports-")) | .id')
          if [ -n "$OLD_IDS" ]; then
            for ID in $OLD_IDS; do
              echo "Purging old artifact ID: $ID"
              gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$ID || true
            done
          fi
          echo "✅ Stale report artifacts cleared."

  scan-images:
    needs: cleanup-previous-runs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Node.js ---
          - { type: "node", version: "18", image: "ghcr.io/taha2samy-3/node:18-dev", v_out: "18-dev-vuln.json", c_out: "18-dev-cis.json", s_out: "18-dev-sbom.json" }
          - { type: "node", version: "18", image: "ghcr.io/taha2samy-3/node:18", v_out: "18-prod-vuln.json", c_out: "18-prod-cis.json", s_out: "18-prod-sbom.json" }
          - { type: "node", version: "20", image: "ghcr.io/taha2samy-3/node:20-dev", v_out: "20-dev-vuln.json", c_out: "20-dev-cis.json", s_out: "20-dev-sbom.json" }
          - { type: "node", version: "20", image: "ghcr.io/taha2samy-3/node:20", v_out: "20-prod-vuln.json", c_out: "20-prod-cis.json", s_out: "20-prod-sbom.json" }

          - { type: "node", version: "22", image: "ghcr.io/taha2samy-3/node:22-dev", v_out: "22-dev-vuln.json", c_out: "22-dev-cis.json", s_out: "22-dev-sbom.json" }
          - { type: "node", version: "22", image: "ghcr.io/taha2samy-3/node:22", v_out: "22-prod-vuln.json", c_out: "22-prod-cis.json", s_out: "22-prod-sbom.json" }
          
          - { type: "node", version: "24", image: "ghcr.io/taha2samy-3/node:24-dev", v_out: "24-dev-vuln.json", c_out: "24-dev-cis.json", s_out: "24-dev-sbom.json" }
          - { type: "node", version: "24", image: "ghcr.io/taha2samy-3/node:24", v_out: "24-prod-vuln.json", c_out: "24-prod-cis.json", s_out: "24-prod-sbom.json" }
          # --- Python ---
          - { type: "python", version: "3.10", image: "ghcr.io/taha2samy-3/python:3.10-dev", v_out: "3.10-dev-vuln.json", c_out: "3.10-dev-cis.json", s_out: "3.10-dev-sbom.json" }
          - { type: "python", version: "3.10", image: "ghcr.io/taha2samy-3/python:3.10", v_out: "3.10-prod-vuln.json", c_out: "3.10-prod-cis.json", s_out: "3.10-prod-sbom.json" }
          - { type: "python", version: "3.11", image: "ghcr.io/taha2samy-3/python:3.11-dev", v_out: "3.11-dev-vuln.json", c_out: "3.11-dev-cis.json", s_out: "3.11-dev-sbom.json" }
          - { type: "python", version: "3.11", image: "ghcr.io/taha2samy-3/python:3.11", v_out: "3.11-prod-vuln.json", c_out: "3.11-prod-cis.json", s_out: "3.11-prod-sbom.json" }
          - { type: "python", version: "3.12", image: "ghcr.io/taha2samy-3/python:3.12-dev", v_out: "3.12-dev-vuln.json", c_out: "3.12-dev-cis.json", s_out: "3.12-dev-sbom.json" }
          - { type: "python", version: "3.12", image: "ghcr.io/taha2samy-3/python:3.12", v_out: "3.12-prod-vuln.json", c_out: "3.12-prod-cis.json", s_out: "3.12-prod-sbom.json" }
          - { type: "python", version: "3.13", image: "ghcr.io/taha2samy-3/python:3.13-dev", v_out: "3.13-dev-vuln.json", c_out: "3.13-dev-cis.json", s_out: "3.13-dev-sbom.json" }
          - { type: "python", version: "3.13", image: "ghcr.io/taha2samy-3/python:3.13", v_out: "3.13-prod-vuln.json", c_out: "3.13-prod-cis.json", s_out: "3.13-prod-sbom.json" }
          - { type: "python", version: "3.14", image: "ghcr.io/taha2samy-3/python:3.14-dev", v_out: "3.14-dev-vuln.json", c_out: "3.14-dev-cis.json", s_out: "3.14-dev-sbom.json" }
          - { type: "python", version: "3.14", image: "ghcr.io/taha2samy-3/python:3.14", v_out: "3.14-prod-vuln.json", c_out: "3.14-prod-cis.json", s_out: "3.14-prod-sbom.json" }
          # --- Bun ---
          - { type: "bun", version: "1", image: "ghcr.io/taha2samy-3/bun:1-dev", v_out: "1-dev-vuln.json", c_out: "1-dev-cis.json", s_out: "1-dev-sbom.json" }
          - { type: "bun", version: "1", image: "ghcr.io/taha2samy-3/bun:1", v_out: "1-prod-vuln.json", c_out: "1-prod-cis.json", s_out: "1-prod-sbom.json" }
          # --- Node 26 ---
          - { type: "node", version: "26", image: "ghcr.io/taha2samy-3/node:26-dev", v_out: "26-dev-vuln.json", c_out: "26-dev-cis.json", s_out: "26-dev-sbom.json" }
          - { type: "node", version: "26", image: "ghcr.io/taha2samy-3/node:26", v_out: "26-prod-vuln.json", c_out: "26-prod-cis.json", s_out: "26-prod-sbom.json" }
          # --- Java OpenJDK ---
          - { type: "java", version: "17", image: "ghcr.io/taha2samy-3/java:17-dev", v_out: "17-dev-vuln.json", c_out: "17-dev-cis.json", s_out: "17-dev-sbom.json" }
          - { type: "java", version: "17", image: "ghcr.io/taha2samy-3/java:17", v_out: "17-prod-vuln.json", c_out: "17-prod-cis.json", s_out: "17-prod-sbom.json" }
          - { type: "java", version: "21", image: "ghcr.io/taha2samy-3/java:21-dev", v_out: "21-dev-vuln.json", c_out: "21-dev-cis.json", s_out: "21-dev-sbom.json" }
          - { type: "java", version: "21", image: "ghcr.io/taha2samy-3/java:21", v_out: "21-prod-vuln.json", c_out: "21-prod-cis.json", s_out: "21-prod-sbom.json" }
          - { type: "java", version: "23", image: "ghcr.io/taha2samy-3/java:23-dev", v_out: "23-dev-vuln.json", c_out: "23-dev-cis.json", s_out: "23-dev-sbom.json" }
          - { type: "java", version: "23", image: "ghcr.io/taha2samy-3/java:23", v_out: "23-prod-vuln.json", c_out: "23-prod-cis.json", s_out: "23-prod-sbom.json" }
          # --- Go ---
          - { type: "go", version: "1.22", image: "ghcr.io/taha2samy-3/go:1.22-dev", v_out: "1.22-dev-vuln.json", c_out: "1.22-dev-cis.json", s_out: "1.22-dev-sbom.json" }
          - { type: "go", version: "1.22", image: "ghcr.io/taha2samy-3/go:1.22", v_out: "1.22-prod-vuln.json", c_out: "1.22-prod-cis.json", s_out: "1.22-prod-sbom.json" }
          - { type: "go", version: "1.23", image: "ghcr.io/taha2samy-3/go:1.23-dev", v_out: "1.23-dev-vuln.json", c_out: "1.23-dev-cis.json", s_out: "1.23-dev-sbom.json" }
          - { type: "go", version: "1.23", image: "ghcr.io/taha2samy-3/go:1.23", v_out: "1.23-prod-vuln.json", c_out: "1.23-prod-cis.json", s_out: "1.23-prod-sbom.json" }
          - { type: "go", version: "1.24", image: "ghcr.io/taha2samy-3/go:1.24-dev", v_out: "1.24-dev-vuln.json", c_out: "1.24-dev-cis.json", s_out: "1.24-dev-sbom.json" }
          - { type: "go", version: "1.24", image: "ghcr.io/taha2samy-3/go:1.24", v_out: "1.24-prod-vuln.json", c_out: "1.24-prod-cis.json", s_out: "1.24-prod-sbom.json" }
          # --- OpenSSL FIPS ---
          - { type: "openssl", version: "3.5", image: "ghcr.io/taha2samy-3/wolfi-openssl-fips:3.5.5-dev", v_out: "openssl-3.5-dev-vuln.json", c_out: "openssl-3.5-dev-cis.json", s_out: "openssl-3.5-dev-sbom.json" }
          - { type: "openssl", version: "3.5", image: "ghcr.io/taha2samy-3/wolfi-openssl-fips:3.5.5", v_out: "openssl-3.5-standard-vuln.json", c_out: "openssl-3.5-standard-cis.json", s_out: "openssl-3.5-standard-sbom.json" }
          - { type: "openssl", version: "3.5", image: "ghcr.io/taha2samy-3/wolfi-openssl-fips:3.5.5-distroless", v_out: "openssl-3.5-prod-vuln.json", c_out: "openssl-3.5-prod-cis.json", s_out: "openssl-3.5-prod-sbom.json" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Security Scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ matrix.image }}
          vuln_out: ${{ matrix.v_out }}
          cis_out: ${{ matrix.c_out }}
          sbom_out: ${{ matrix.s_out }}
          artifact_name: "reports-${{ matrix.type }}-${{ matrix.version }}-${{ matrix.v_out }}"

  deploy-web:
    needs: scan-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Clean Stale Runner Directory (Lifecycle Policy)
        run: rm -rf reports reports4ms web/dist

      - name: Download and Merge Reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate Image Sizes Metadata (reports/config.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_metadata.py -c web/runtimes.yaml -o reports

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Dynamic Dashboard (Static Production Build)
        working-directory: web
        run: npm run build

      - name: Clean Ephemeral Reports Directory (Lifecycle Policy)
        run: rm -rf reports reports4ms

      - name: tree all infra
        run: tree -a 

      - name: Push to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist

      - name: Purge Temporary Scan Report Artifacts (Lifecycle Policy)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Purging ephemeral report artifacts from GitHub Actions storage..."
          ARTIFACT_IDS=$(gh api --paginate /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | startswith("reports-")) | .id')
          if [ -n "$ARTIFACT_IDS" ]; then
            for ID in $ARTIFACT_IDS; do
              echo "Removing ephemeral artifact ID: $ID"
              gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$ID || true
            done
          fi
          echo "✅ Ephemeral report artifact lifecycle cleanup complete."