name: Generate Security Dashboard and Deploy

on:
  workflow_dispatch:
    inputs:
      rescan:
        description: "What to rescan: 'missing' (images without stored reports), 'all', or runtimes / versions such as 'node-22 openjdk'"
        required: false
        default: missing
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'scripts/fetch_metadata.py'
  workflow_run:
    workflows: ["Build and Push Images", "FIPS Benchmarks"]
    types:
      - completed

# Queue instead of cancelling so the reports of every finished build reach the dashboard
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      scans: ${{ steps.plan.outputs.scans }}
      has_scans: ${{ steps.plan.outputs.has_scans }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Delete Stale Report Artifacts from Previous Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_IDS=$(gh api --paginate /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | startswith("reports-")) | .id')
          for ID in $OLD_IDS; do
            gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/"$ID" || true
          done

      - name: Restore Published Reports
        run: |
          mkdir -p store
          if git fetch --depth=1 origin gh-pages 2>/dev/null && git cat-file -e FETCH_HEAD:reports 2>/dev/null; then
            git archive FETCH_HEAD reports | tar -x -C store
          fi
          mkdir -p store/reports
          echo "Stored reports: $(find store/reports -name '*.json' | wc -l)"

      - name: Download Build Plan
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: build-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Planner Dependencies
        run: pip install pyyaml

      - name: Plan Scans
        id: plan
        env:
          RESCAN: ${{ inputs.rescan || 'missing' }}
        run: python .github/scripts/plan_images.py scan --mode "$RESCAN" --store store/reports --build-plan build-plan.json

  scan-images:
    needs: plan
    if: needs.plan.outputs.has_scans == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scans) }}

    name: scan (${{ matrix.suffix }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Security Scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ matrix.image }}
          platform: ${{ matrix.platform }}
          vuln_out: ${{ matrix.report }}-vuln.json
          cis_out: ${{ matrix.report }}-cis.json
          sbom_out: ${{ matrix.report }}-sbom.json
          artifact_name: "reports-${{ matrix.suffix }}"

  deploy-web:
    needs: [plan, scan-images]
    if: "!cancelled() && needs.plan.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Clean Stale Runner Directory (Lifecycle Policy)
        run: rm -rf reports reports4ms web/dist

      # Reports of images that were not rescanned keep their last published version
      - name: Restore Published Reports
        run: |
          mkdir -p reports
          if git fetch --depth=1 origin gh-pages 2>/dev/null && git cat-file -e FETCH_HEAD:reports 2>/dev/null; then
            git archive FETCH_HEAD reports | tar -x
          fi

      - name: Download New Scan Reports
        if: needs.scan-images.result == 'success' || needs.scan-images.result == 'failure'
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: reports-*
          merge-multiple: true

      # FIPS test results (and benchmarks) produced by the workflow run that triggered this deploy
      - name: Download FIPS Test and Benchmark Results
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: "{fips-tests,benchmarks}-*"
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: pip install pyyaml

      - name: Drop Reports of Images No Longer Published
        run: python .github/scripts/plan_images.py prune --store reports

      # Status and sunset date of the FIPS 140-3 certificates, shown on the FIPS module tabs
      - name: Check FIPS Certificates
        continue-on-error: true
        run: python .github/scripts/cmvp_watch.py --json reports/fips-certificates.json

      - name: Generate Image Sizes Metadata (reports/config.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_metadata.py -c web/runtimes.yaml -o reports

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Build Dynamic Dashboard (Static Production Build)
        working-directory: web
        run: npm run build

      # Published next to the site so the next deploy can reuse them
      - name: Store Reports With the Site
        run: |
          mkdir -p web/dist/reports
          cp reports/*.json web/dist/reports/
          rm -rf reports reports4ms

      - name: Push to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist

      - name: Purge Temporary Scan Report Artifacts (Lifecycle Policy)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_IDS=$(gh api --paginate /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name | startswith("reports-")) | .id')
          for ID in $ARTIFACT_IDS; do
            gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/"$ID" || true
          done
