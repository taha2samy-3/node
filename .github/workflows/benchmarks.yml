name: FIPS Benchmarks

# Weekly crypto throughput of every FIPS image against a non-FIPS baseline, on native amd64 and arm64
# runners. Results are published on the dashboard by the "Generate Security Dashboard and Deploy" run
# this workflow triggers. Shared runners are noisy: compare ratios, not absolute numbers.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions per measurement (median is kept)
        required: false
        default: "3"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.plan.outputs.units }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: List FIPS Images
        id: plan
        run: python .github/scripts/plan_images.py fips-matrix

  benchmark:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.units) }}

    name: benchmark (${{ matrix.unit }}, ${{ matrix.arch }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Benchmarks
        env:
          RUNS: ${{ inputs.runs || '3' }}
        run: python .github/scripts/run_benchmarks.py --unit "${{ matrix.unit }}" --arch "${{ matrix.arch }}" --runs "$RUNS" --out benchmarks

      - name: Upload Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.unit }}-${{ matrix.arch }}
          path: benchmarks/
          retention-days: 7
