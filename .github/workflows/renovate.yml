name: Renovate

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run mode: empty (full run) or 'full' / 'lookup'"
        required: false
        default: ""
      logLevel:
        description: "Renovate log level (debug, info, warn, error)"
        required: false
        default: "info"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read
  actions: write
  checks: read
  statuses: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check GitHub App Secrets
        id: setup
        env:
          CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${CLIENT_ID}" && -n "${PRIVATE_KEY}" ]]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Renovate App Token
        id: app-token
        if: steps.setup.outputs.has_app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Renovate needs an App token or fine-grained PAT so its commits trigger CI on PRs
      # and can update workflow files in .github/workflows.
      - name: Check Renovate Token
        env:
          HAS_TOKEN: ${{ steps.app-token.outputs.token != '' || secrets.RENOVATE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::Neither Renovate App nor RENOVATE_TOKEN is set: Renovate falls back to GITHUB_TOKEN, cannot update workflow files or read vulnerability alerts, and its PRs get no CI runs"
          fi

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || '' }}
          RENOVATE_AUTODISCOVER: 'false'
