name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild:
        description: "What to rebuild: 'changed' (images whose inputs changed), 'all', or runtimes / versions / targets such as 'node-22 openjdk'"
        required: false
        default: changed

# Queue instead of cancelling: the next run only rebuilds what this one has not published yet
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      merge: ${{ steps.plan.outputs.merge }}
      build_dependents: ${{ steps.plan.outputs.build_dependents }}
      merge_dependents: ${{ steps.plan.outputs.merge_dependents }}
      images: ${{ steps.plan.outputs.images }}
      images_stage1: ${{ steps.plan.outputs.images_stage1 }}
      images_dependents: ${{ steps.plan.outputs.images_dependents }}
      tests: ${{ steps.plan.outputs.tests }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_dependents: ${{ steps.plan.outputs.has_dependents }}
      has_images: ${{ steps.plan.outputs.has_images }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      packages: ${{ steps.plan.outputs.packages }}
      has_packages: ${{ steps.plan.outputs.has_packages }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Planner Dependencies
        run: pip install pyyaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan Image Builds
        id: plan
        env:
          REBUILD: ${{ inputs.rebuild || 'changed' }}
        run: python .github/scripts/plan_images.py build --mode "$REBUILD" --output build-plan.json

      - name: Upload Build Plan
        uses: actions/upload-artifact@v7
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 7

  # ==========================================
  # Build, merge and attest (SLSA Build L3)
  # ==========================================
  # Both stages run in the reusable build-images.yml, so the provenance of every image is signed by
  # the workflow that built it. Stage one builds images from scratch; stage two builds the images
  # that consume one of them (node-fips copies the FIPS provider from openssl-fips).
  images:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yml
    with:
      build: ${{ needs.plan.outputs.build }}
      merge: ${{ needs.plan.outputs.merge }}
      images: ${{ needs.plan.outputs.images_stage1 }}

  images-dependents:
    needs: [plan, images]
    if: "!cancelled() && needs.plan.outputs.has_dependents == 'true'"
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yml
    with:
      build: ${{ needs.plan.outputs.build_dependents }}
      merge: ${{ needs.plan.outputs.merge_dependents }}
      images: ${{ needs.plan.outputs.images_dependents }}
      check-requires: true

  # Runs after attestation and never gates it. Tagged images keep their platform manifests and
  # referrers (attestations), so only leftovers of failed or superseded builds are removed.
  cleanup:
    needs: [plan, images, images-dependents]
    if: "!cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.has_packages == 'true'"
    runs-on: ubuntu-latest
    # Housekeeping only: a slow or failed cleanup must not mark a successful build as failed.
    # The first runs over all packages work through a large backlog; later runs are short.
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      packages: write

    steps:
      - name: Cleanup Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ needs.plan.outputs.packages }}
          delete-untagged: true

  # ==========================================
  # FIPS 140-3 test suites on both architectures, against the published images
  # ==========================================
  fips-tests:
    needs: [plan, images, images-dependents]
    if: "!cancelled() && needs.plan.outputs.has_tests == 'true'"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}

    name: fips tests (${{ matrix.unit }}, ${{ matrix.arch }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: pip install pyyaml pytest allure-pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Images Were Rebuilt
        id: verify
        env:
          REQUIRES: ${{ matrix.requires }}
        run: python .github/scripts/plan_images.py verify --requires "$REQUIRES"

      - name: Pull Images
        if: steps.verify.outputs.built == 'true'
        env:
          REQUIRES: ${{ matrix.requires }}
        run: echo "$REQUIRES" | cut -d' ' -f1 | xargs -r -n1 docker pull -q

      - name: Run FIPS Test Suites
        if: steps.verify.outputs.built == 'true'
        run: python .github/scripts/fips_tests.py --unit "${{ matrix.unit }}" --arch "${{ matrix.arch }}" --out fips-results

      - name: Run FIPS Benchmarks
        if: steps.verify.outputs.built == 'true'
        run: python .github/scripts/run_benchmarks.py --unit "${{ matrix.unit }}" --arch "${{ matrix.arch }}" --runs 1 --seconds 1 --out benchmarks

      - name: Upload Test Results
        if: always() && steps.verify.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fips-tests-${{ matrix.unit }}-${{ matrix.arch }}
          path: fips-results/
          retention-days: 7

      - name: Upload Benchmark Results
        if: always() && steps.verify.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fips-benchmarks-${{ matrix.unit }}-${{ matrix.arch }}
          path: benchmarks/
          retention-days: 7
