name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild:
        description: "What to rebuild: 'changed' (images whose inputs changed), 'all', or runtimes / versions / targets such as 'node-22 openjdk'"
        required: false
        default: changed

# Queue instead of cancelling: the next run only rebuilds what this one has not published yet
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build_dependents: ${{ steps.plan.outputs.build_dependents }}
      images: ${{ steps.plan.outputs.images }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_dependents: ${{ steps.plan.outputs.has_dependents }}
      has_images: ${{ steps.plan.outputs.has_images }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Planner Dependencies
        run: pip install pyyaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan Image Builds
        id: plan
        env:
          REBUILD: ${{ inputs.rebuild || 'changed' }}
        run: python .github/scripts/plan_images.py build --mode "$REBUILD" --output build-plan.json

      - name: Upload Build Plan
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}

    name: build (${{ matrix.unit }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Runtime Images
        uses: ./.github/actions/bake-build
        with:
          targets: ${{ matrix.targets }}
          set: ${{ matrix.set }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  # Images that consume another image built in this run (node-fips copies the provider from openssl-fips)
  build-dependents:
    needs: [plan, build]
    if: >-
      !cancelled() && needs.plan.outputs.has_dependents == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build_dependents) }}

    name: build (${{ matrix.unit }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Runtime Images
        uses: ./.github/actions/bake-build
        with:
          targets: ${{ matrix.targets }}
          set: ${{ matrix.set }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: [build, build-dependents]
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'failure' ||
       needs.build-dependents.result == 'success' || needs.build-dependents.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Cleanup Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true

  attest:
    needs: [plan, cleanup]
    if: "!cancelled() && needs.plan.outputs.has_images == 'true' && needs.cleanup.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}

    name: attest (${{ matrix.suffix }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Planner Dependencies
        run: pip install pyyaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Image Was Rebuilt
        id: verify
        run: python .github/scripts/plan_images.py verify --tag "${{ matrix.image }}:${{ matrix.tag }}" --fingerprint "${{ matrix.fingerprint }}"

      - name: Attest Runtime Image
        if: steps.verify.outputs.built == 'true'
        uses: ./.github/actions/attest-image
        with:
          image-name: ${{ matrix.image }}
          image-tag: ${{ matrix.tag }}
          artifact-suffix: ${{ matrix.suffix }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to GitHub Dependency Graph
        if: steps.verify.outputs.built == 'true'
        uses: ./.github/actions/upload-dependency-graph
        with:
          sbom-path: "${{ matrix.suffix }}.cyclonedx.json"
          target-name: ${{ matrix.suffix }}
          repo: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
