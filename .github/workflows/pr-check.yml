name: Pull Request Check

# Builds every image a pull request changes (linux/amd64, nothing is pushed) and runs the
# FIPS 140-3 test suites against the FIPS images, so dependency updates are verified before merging.
on:
  pull_request:
    branches:
      - main
  # Dependency-update PRs are opened with GITHUB_TOKEN. GitHub holds their pull_request runs at
  # "action required" (approval), so update_dependencies.py dispatches this workflow on the update
  # branch instead, deletes the held runs, and the report job below shows the result on the PR
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      has_pr: ${{ steps.plan.outputs.has_pr }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Planner Dependencies
        run: pip install pyyaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images whose build inputs differ from the published ones
      - name: Plan Image Builds
        id: plan
        run: python .github/scripts/plan_images.py build --mode changed --output build-plan.json

  check:
    needs: plan
    if: needs.plan.outputs.has_pr == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pr) }}

    name: check (${{ matrix.unit }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: pip install pyyaml pytest allure-pytest

      # Images this unit is built from that the same pull request also changes (openssl-fips for node-fips)
      - name: Build Changed Dependencies
        if: matrix.deps != ''
        env:
          TARGETS: ${{ matrix.deps }}
        run: |
          IFS=',' read -ra targets <<< "$TARGETS"
          docker buildx bake --load --provenance=false --sbom=false \
            --set '*.platform=linux/amd64' --set '*.cache-from=' --set '*.cache-to=' --set '*.annotations=' \
            "${targets[@]}"

      - name: Build Images
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          IFS=',' read -ra targets <<< "$TARGETS"
          docker buildx bake --load --provenance=false --sbom=false \
            --set '*.platform=linux/amd64' --set '*.cache-from=' --set '*.cache-to=' --set '*.annotations=' \
            "${targets[@]}"

      - name: Run FIPS Test Suites
        if: matrix.fips
        run: python .github/scripts/fips_tests.py --unit "${{ matrix.unit }}" --arch amd64 --out fips-results

      - name: Run FIPS Benchmarks
        if: matrix.fips
        run: python .github/scripts/run_benchmarks.py --unit "${{ matrix.unit }}" --arch amd64 --runs 1 --seconds 1 --out benchmarks

      - name: Upload Test Results
        if: always() && matrix.fips
        uses: actions/upload-artifact@v7
        with:
          name: pr-fips-tests-${{ matrix.unit }}
          path: fips-results/
          retention-days: 7

      - name: Upload Benchmark Results
        if: always() && matrix.fips
        uses: actions/upload-artifact@v7
        with:
          name: pr-benchmarks-${{ matrix.unit }}
          path: benchmarks/
          retention-days: 7

  # Dispatched runs are not listed in a pull request's checks, so publish the outcome as a commit
  # status on the branch head, which the pull request does show
  report:
    needs: [plan, check]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish Commit Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ needs.plan.result }}
          CHECK: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PLAN" = success ] && { [ "$CHECK" = success ] || [ "$CHECK" = skipped ]; }; then
            state=success; description="Images build and FIPS suites pass"
          else
            state=failure; description="plan: $PLAN, check: $CHECK"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="Pull Request Check" \
            -f description="$description" -f target_url="$RUN_URL"
