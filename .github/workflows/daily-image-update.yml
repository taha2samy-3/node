name: Daily Dependency Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: "Only update one group (runtimes, openssl-fips, openjdk-fips, base); empty updates all"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      # One pull request per group in .github/dependencies.yml; certified FIPS modules are never changed here
      - name: Update Pinned Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROUP: ${{ inputs.group }}
        run: |
          python .github/scripts/update_dependencies.py --pull-request \
            --base "${{ github.event.repository.default_branch }}" \
            ${GROUP:+--group "$GROUP"}
