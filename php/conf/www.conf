; PHP-FPM pool for the prod image. FPM already runs as the image's non-root user (UID 1000), so
; the pool sets no user or group.
[www]
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Recycle workers regularly. PHP2Shell CVE-2026-109619 leaves state behind in a worker for the next
; request; with the fixed release this is defence in depth (PHP's interim advice was 1 for unpatched
; servers, which costs a fork per request).
pm.max_requests = 500

; Health check endpoints for the orchestrator (FastCGI only, not exposed over HTTP by FPM itself)
ping.path = /fpm-ping
pm.status_path = /fpm-status

; Only .php files are executed
security.limit_extensions = .php

; Container logging
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Keep the container environment (database URLs, secrets from envoke) visible to PHP
clear_env = no

; Settings a front end must not override per request (PHP's PHP2Shell guidance: remove
; per-request INI such as PHP_VALUE); php_admin_value cannot be changed by PHP_VALUE or ini_set()
php_admin_value[session.upload_progress.enabled] = 0
php_admin_flag[expose_php] = off
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[max_input_nesting_level] = 32
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
