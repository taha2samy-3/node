; Hardened PHP settings for every image (dev and prod), loaded from /etc/php/conf.d.
; Applications can override them with their own conf.d file (e.g. 99-app.ini) or the FPM pool.

[PHP]
; Information disclosure
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
html_errors = Off
zend.exception_ignore_args = On
zend.assertions = -1

; Remote code inclusion
allow_url_include = Off

; Request limits. Besides being good defaults, these are part of PHP's interim guidance for
; PHP2Shell CVE-2026-109618 (out-of-memory during request setup): a smaller request body and
; shallower input nesting reduce how much memory a single request can make PHP allocate.
; upload_max_filesize stays below post_max_size.
post_max_size = 32M
upload_max_filesize = 16M
max_file_uploads = 10
max_input_vars = 1000
max_input_nesting_level = 32
max_input_time = 30
max_execution_time = 30
memory_limit = 256M

; Uploads go to a private temporary directory
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

[Session]
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
; PHP2Shell CVE-2026-109619: PHP's advisory names the session upload-progress handler as the
; confirmed attack path. These images ship the fixed releases (8.2.35, 8.3.36, 8.4.27, 8.5.12);
; this stays off as defence in depth because few applications need it.
session.upload_progress.enabled = 0

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
