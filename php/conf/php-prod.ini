; Production-only settings (prod image). Override in a later conf.d file if an application needs them.
[PHP]
; Program execution from PHP code; web applications rarely need it and attackers usually do
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
; Remote URLs through file functions (use the curl extension for HTTP clients)
allow_url_fopen = Off

[opcache]
; Code is baked into the image, so never stat files for changes
opcache.validate_timestamps = 0
