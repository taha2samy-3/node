  # ==========================================
  # Node.js FIPS 140-3 Runtimes
  # ==========================================
  - id: "node-fips"
    title: "Node.js FIPS"
    icon: "https://cdn.simpleicons.org/nodedotjs/339933"
    fips:
      module: "OpenSSL FIPS Provider 3.1.2, loaded by the system libcrypto"
      enforcement: "openssl-fips.cnf activates only the FIPS and base providers with fips=yes as the default property, and NODE_OPTIONS=--force-fips stops application code from calling crypto.setFips(false)."
      verify: "docker run --rm --entrypoint /usr/bin/node {tag} /usr/share/nodejs-fips/fips-check.js"
    architectures:
      - "linux/amd64"
      - "linux/arm64"
    versions:
      - version: "24"
        flavors:
          - id: "prod"
            name: "Distroless FIPS Runtime (Scratch)"
            policy_header: "Hardened Distroless Node.js 24 FIPS 140-3 Runtime"
            policy_text: "Node.js 24 on a scratch root filesystem with no shell and no package manager. Wolfi's Node.js loads the validated OpenSSL FIPS 3.1.2 provider, approved algorithms are the default, and --force-fips stops applications from switching FIPS mode off."
            tags:
              - "ghcr.io/taha2samy-3/node-fips:24-distroless"
            reports:
              vuln: "./../reports/node-fips-24-prod-vuln.json"
              cis: "./../reports/node-fips-24-prod-cis.json"
              sbom: "./../reports/node-fips-24-prod-sbom.json"
          - id: "standard"
            name: "Standard FIPS Runtime (with Shell)"
            policy_header: "Production Node.js 24 FIPS 140-3 Runtime"
            policy_text: "Minimal Node.js 24 runtime with tini and a non-root busybox shell. Non-approved algorithms such as MD5, ChaCha20 and RSA-1024 are rejected by the OpenSSL FIPS provider."
            tags:
              - "ghcr.io/taha2samy-3/node-fips:24"
            reports:
              vuln: "./../reports/node-fips-24-standard-vuln.json"
              cis: "./../reports/node-fips-24-standard-cis.json"
              sbom: "./../reports/node-fips-24-standard-sbom.json"
          - id: "dev"
            name: "Development Builder (with NPM)"
            policy_header: "Node.js 24 FIPS Development Suite"
            policy_text: "Node.js 24 with npm for building and testing applications under the same enforced OpenSSL FIPS 140-3 policy as the runtime images."
            tags:
              - "ghcr.io/taha2samy-3/node-fips:24-dev"
            reports:
              vuln: "./../reports/node-fips-24-dev-vuln.json"
              cis: "./../reports/node-fips-24-dev-cis.json"
              sbom: "./../reports/node-fips-24-dev-sbom.json"

      - version: "22"
        flavors:
          - id: "prod"
            name: "Distroless FIPS Runtime (Scratch)"
            policy_header: "Hardened Distroless Node.js 22 FIPS 140-3 Runtime"
            policy_text: "Node.js 22 on a scratch root filesystem with no shell and no package manager. Wolfi's Node.js loads the validated OpenSSL FIPS 3.1.2 provider, approved algorithms are the default, and --force-fips stops applications from switching FIPS mode off."
            tags:
              - "ghcr.io/taha2samy-3/node-fips:22-distroless"
            reports:
              vuln: "./../reports/node-fips-22-prod-vuln.json"
              cis: "./../reports/node-fips-22-prod-cis.json"
              sbom: "./../reports/node-fips-22-prod-sbom.json"
          - id: "standard"
            name: "Standard FIPS Runtime (with Shell)"
            policy_header: "Production Node.js 22 FIPS 140-3 Runtime"
            policy_text: "Minimal Node.js 22 runtime with tini and a non-root busybox shell. Non-approved algorithms such as MD5, ChaCha20 and RSA-1024 are rejected by the OpenSSL FIPS provider."
            tags:
              - "ghcr.io/taha2samy-3/node-fips:22"
            reports:
              vuln: "./../reports/node-fips-22-standard-vuln.json"
              cis: "./../reports/node-fips-22-standard-cis.json"
              sbom: "./../reports/node-fips-22-standard-sbom.json"
          - id: "dev"
            name: "Development Builder (with NPM)"
            policy_header: "Node.js 22 FIPS Development Suite"
            policy_text: "Node.js 22 with npm for building and testing applications under the same enforced OpenSSL FIPS 140-3 policy as the runtime images."
