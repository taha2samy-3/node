  # ==========================================
  - id: "openjdk"
    title: "Wolfi OpenJDK FIPS"
    icon: "https://cdn.simpleicons.org/openjdk/5382A1"
    fips:
      module: "Bouncy Castle FIPS Java API 2.1.2 (BC-FJA)"
      enforcement: "java.security registers BCFIPS and BCJSSE as the first providers, BCFKS is the default keystore and JAVA_TOOL_OPTIONS sets org.bouncycastle.fips.approved_only=true."
      verify: "docker run --rm --entrypoint /opt/java/bin/java {tag} -XshowSettings:properties -version"
    architectures:
      - "linux/amd64"
      - "linux/arm64"
    versions:
      - version: "25"
